---
layout: default
---

<div class="page-hero">
  <div class="page-hero-inner">
    <p class="hero-eyebrow">News</p>
    <h1>{{ page.title }}</h1>
    <p style="color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-top: 10px;">{{ page.date | date: "%B %-d, %Y" }}</p>
  </div>
</div>

<div class="section">
  {% if page.image %}
  <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="width:100%; max-height:400px; object-fit:cover; border-radius:3px; margin-bottom:40px;" />
  {% endif %}
  <div class="post-content">
    {{ content }}
  </div>
  <div style="margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border);">
    <a href="{{ '/news/' | relative_url }}" style="color: var(--sky); text-decoration: none; font-size: 0.85rem; font-weight: 500;">← Back to News</a>
  </div>
</div>
