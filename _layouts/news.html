---
layout: default
---

<div class="page-hero">
  <div class="page-hero-inner">
    <h1>News</h1>
  </div>
</div>

<div class="section">
  <div class="news-grid">
    {% for post in site.posts %}
    <a class="news-card" href="{{ post.url | relative_url }}">
      {% if post.image %}
      <img src="{{ post.image | relative_url }}" alt="{{ post.title }}" loading="lazy" />
      {% endif %}
      <div class="news-card-body">
        <p style="font-size:0.72rem; color:var(--text-light); margin-bottom:6px;"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time></p>
        <p class="news-card-title">{{ post.title }}</p>
        <p class="news-card-excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
      </div>
    </a>
    {% endfor %}
  </div>
</div>
