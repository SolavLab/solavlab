# ── TEAM PAGE DATA ───────────────────────────────────────────────────────────
# People appear on the Team page in the same order as they are listed here.
# To add a member: copy a block, fill in the fields, save. That's it.
# To move someone to "Past members": cut their block from "current:", paste it
#   under "past:", and change the role to e.g. "MSc student (2026)".
# Fields: name, role and photo are needed; everything else is optional
#   (degree, email, dept, office, phone, linkedin, scholar, orcid).
# photo: put the image file in assets/img/team/ and write e.g.
#         "/assets/img/team/jane.jpg" - or use a full URL if hosted elsewhere.

