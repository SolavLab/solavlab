# ── PUBLICATIONS ─────────────────────────────────────────────────────────────
# Shown on /publications/journal-papers/ (grouped by year, newest first).
#
# To add a paper: copy one block (from "- year:" to the next blank line),
# paste it at the top of the right year, fill in the fields, save. Done.
#
#   year:     publication year (the page groups papers by this)
#   type:     journal | conference | preprint | patent
#             (anything other than "journal" gets a small label on the page)
#   title:    paper title
#   authors:  author list, exactly as you want it shown
#   venue:    journal / proceedings / archive name
#   details:  optional — volume(issue), pages or article number
#   doi:      optional — just the DOI, e.g. "10.1016/j.jmbbm.2023.105708"
#             (the page turns it into a https://doi.org/ link)
#   link:     optional — any other web link (used when there is no DOI)
#   preprint: optional — link to a free preprint
#   code:     optional — link to GitHub / Zenodo
#   pdf:      optional — path to a local PDF (e.g. /assets/pdf/x.pdf) or URL
#   image:    optional — thumbnail picture (URL or /assets/img/... path)
#
# Order inside a year = order on the page.
# ─────────────────────────────────────────────────────────────────────────────

