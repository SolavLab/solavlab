title: SoBIG
tagline: Solav Biomechanical Interfaces Group
description: >
  Solav Biomechanical Interfaces Group (SoBIG) is a research group at Technion
  (Haifa, Israel) that studies human musculoskeletal biomechanics and develops
  innovative medical devices and research tools to improve the comfort and
  function of prosthetic and orthotic users.
url: "https://solavlab.github.io"   # at domain cutover: "https://www.solavlab.com"
baseurl: "/solavlab"                # at domain cutover: ""
timezone: Asia/Jerusalem

email: sobig@technion.ac.il
phones:                            # shown in the footer
  - label: Office
    number: "+972-73-378-5494"
  - label: Lab
    number: "+972-73-378-1643"
address: "103 Lady Davis Bldg., Technion City, Haifa, 3200003, Israel"
maps_link: "https://www.google.com/maps?q=32.7741731,35.0230694"

social:
  linkedin: "https://www.linkedin.com/in/dana-solav-31878b41/"
  scholar: "https://scholar.google.com/citations?user=AwjDDLAAAAAJ&hl=en&oi=ao"
  orcid: "https://orcid.org/0000-0003-3215-0401"
  github: "https://github.com/SolavLab"

# Build settings
markdown: kramdown
permalink: /:title/

collections:
  posts:
    permalink: /post/:title/   # same URLs as the old Wix blog

# Default layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-redirect-from

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.zip"
  - README.md
